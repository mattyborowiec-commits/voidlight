[package]
name = "voidlight"
version = "0.1.0"
description = "Szybki launcher Minecrafta"
edition = "2021"

[lib]
name = "voidlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
sysinfo = "0.33"
sha1 = "0.10"
futures = "0.3"
tokio = { version = "1", features = ["fs", "rt", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
# Szybkie budowanie (launcher jest lekki, wolniejsze LTO nie daje zauwazalnej roznicy)
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = true
