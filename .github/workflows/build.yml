$yaml = @'
name: Build Voidlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build
        working-directory: .

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: voidlight-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
'@

$yaml | Set-Content "C:\Users\2E_3\Desktop\launcher\.github\workflows\build.yml" -Encoding UTF8

cd "C:\Users\2E_3\Desktop\launcher"
git add .github/workflows/build.yml
git commit -m "fix: use cargo tauri build directly"
git push
